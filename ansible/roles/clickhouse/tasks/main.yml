---
- name: Require application password
  ansible.builtin.assert:
    that:
      - clickhouse_app_password | length >= 24
      - "'CHANGE_ME' not in clickhouse_app_password"
  no_log: true
- name: Require ClickHouse data mount
  ansible.builtin.command: mountpoint -q /var/lib/clickhouse
  changed_when: false
- name: Download ClickHouse signing key
  ansible.builtin.get_url:
    url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
    dest: /usr/share/keyrings/clickhouse.asc
    mode: '0644'
- name: Add signed ClickHouse stable repository
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/clickhouse.asc] https://packages.clickhouse.com/deb stable main'
    filename: clickhouse
    state: present
- name: Install ClickHouse
  ansible.builtin.apt:
    name: [clickhouse-server, clickhouse-client]
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
- name: Set data directory ownership
  ansible.builtin.file:
    path: /var/lib/clickhouse
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: '0750'
- name: Configure listener and memory budget
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/evinfl.xml
    mode: '0644'
    content: |
      <clickhouse>
        <listen_host replace="replace">0.0.0.0</listen_host>
        <max_server_memory_usage>6442450944</max_server_memory_usage>
      </clickhouse>
  notify: Restart ClickHouse
- name: Configure application user and localhost-only default user
  ansible.builtin.template:
    src: users.xml.j2
    dest: /etc/clickhouse-server/users.d/evinfl.xml
    owner: root
    group: clickhouse
    mode: '0640'
  no_log: true
  notify: Restart ClickHouse
- name: Create service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/clickhouse-server.service.d
    state: directory
    mode: '0755'
- name: Require ClickHouse data disk at startup
  ansible.builtin.copy:
    dest: /etc/systemd/system/clickhouse-server.service.d/20-evinfl-storage.conf
    mode: '0644'
    content: |
      [Unit]
      RequiresMountsFor=/var/lib/clickhouse
- name: Start ClickHouse
  ansible.builtin.systemd_service:
    name: clickhouse-server
    state: started
    enabled: true
    daemon_reload: true
