---
- name: Inspect active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false
  check_mode: false
- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: active_swap.stdout | length > 0
  changed_when: true
- name: Disable persistent swap entries
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
- name: Configure kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/evinfl-kubernetes.conf
    mode: '0644'
    content: |
      overlay
      br_netfilter
- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]
- name: Configure Kubernetes sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-evinfl-kubernetes.conf
    reload: true
  loop:
    - {key: net.ipv4.ip_forward, value: '1'}
    - {key: net.bridge.bridge-nf-call-iptables, value: '1'}
    - {key: net.bridge.bridge-nf-call-ip6tables, value: '1'}
- name: Require runtime mounts at service startup on workers
  when: inventory_hostname in groups['k8s_workers']
  block:
    - name: Create systemd drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.service.d"
        state: directory
        mode: '0755'
      loop: [containerd, kubelet]
    - name: Set runtime mount dependency
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item }}.service.d/20-evinfl-storage.conf"
        mode: '0644'
        content: |
          [Unit]
          RequiresMountsFor=/srv/k8s-data /var/lib/containerd /var/lib/kubelet
      loop: [containerd, kubelet]
    - name: Preserve shared kubelet propagation after reboot
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/30-evinfl-propagation.conf
        mode: '0644'
        content: |
          [Service]
          ExecStartPre=/bin/mount --make-rshared /var/lib/kubelet
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
