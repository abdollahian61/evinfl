# Draft: Ubuntu 24.04; HAProxy private IP 192.168.1.5.
# Install a valid full certificate chain + private key at the PEM path below.
# app.example.com is the placeholder domain used in the documentation.
# Port 30080 must be assigned to the HTTP Service for Traefik.
global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

frontend http_in
    bind :80
    http-request redirect scheme https code 301

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/default.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    default_backend kubernetes_traefik

backend kubernetes_traefik
    balance roundrobin
    default-server check inter 3s fall 3 rise 2
    server worker01 192.168.1.21:30080
    server worker02 192.168.1.22:30080
    server worker03 192.168.1.23:30080
