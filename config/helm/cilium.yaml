kubeProxyReplacement: true
k8sServiceHost: 192.168.1.10
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
MTU: 0
ipam:
  mode: kubernetes
k8s:
  requireIPv4PodCIDR: true
ipv4:
  enabled: true
ipv6:
  enabled: false
bpf:
  masquerade: true
operator:
  replicas: 1
  hostNetwork: true
# Traefik implements Gateway API in this design.
gatewayAPI:
  enabled: false
ingressController:
  enabled: false
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
