apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-local-worker01
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-local
  local:
    path: /srv/k8s-data/observability/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8s-worker01]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-local-worker01
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-local
  local:
    path: /srv/k8s-data/observability/alertmanager
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8s-worker01]
