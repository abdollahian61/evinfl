apiVersion: v1
kind: Namespace
metadata:
  name: cilium-smoke
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: echo
  namespace: cilium-smoke
spec:
  selector:
    matchLabels: {app: cilium-smoke-echo}
  template:
    metadata:
      labels: {app: cilium-smoke-echo}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: echo
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - 'mkdir -p /tmp/www; hostname > /tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www'
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: cilium-smoke
spec:
  selector: {app: cilium-smoke-echo}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: cilium-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: cilium-smoke-client}
  template:
    metadata:
      labels: {app: cilium-smoke-client}
    spec:
      containers:
        - name: client
          image: busybox:1.37.0
          command: [sh, -ec, 'while true; do sleep 3600; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
